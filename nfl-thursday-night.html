<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>NFL Thursday Night Dashboard</title>
    <meta name="description" content="Fat Tony's Picks — Thursday Night Football board, built fresh for each Thursday game." />
    <style>
      :root {
        --bg: #f4f4f2;
        --surface: #ffffff;
        --surface-2: #ececea;
        --ink: #17181a;
        --ink-2: #4a4d52;
        --ink-3: #767b82;
        --line: #d9d9d4;
        --gold: #c9a227;
        --gold-soft: #f3e9c8;
        --gold-ink: #6d5606;
        --black: #17181a;
        --strong: #1a6b32;
        --strong-bg: #e2f1e6;
        --lean: #8a5a00;
        --lean-bg: #f7ecd2;
        --unv: #9a2a2a;
        --unv-bg: #f6e3e3;
        --fan: #17181a;
        --fan-bg: #f3e9c8;
        --crazy: #5b2a86;
        --crazy-bg: #eee4f7;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #101112;
          --surface: #1a1b1d;
          --surface-2: #242628;
          --ink: #f0f0ee;
          --ink-2: #c3c6cb;
          --ink-3: #9298a0;
          --line: #33363a;
          --gold: #d9b23a;
          --gold-soft: #3a3212;
          --gold-ink: #ecd27a;
          --black: #f0f0ee;
          --strong: #7ed79b;
          --strong-bg: #173324;
          --lean: #eec25e;
          --lean-bg: #3a2f10;
          --unv: #f09595;
          --unv-bg: #3d1e1e;
          --fan: #ecd27a;
          --fan-bg: #3a3212;
          --crazy: #cda8f2;
          --crazy-bg: #2e1f42;
        }
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
        font-size: 13px;
        line-height: 1.45;
      }
      .wrap { max-width: 880px; margin: 0 auto; padding: 12px 12px 28px; }

      /* Header — refresh line only */
      .topbar {
        display: flex; align-items: center; gap: 8px;
        padding: 6px 2px 10px;
        border-bottom: 3px solid var(--gold);
        margin-bottom: 12px;
      }
      .topbar img { width: 20px; height: auto; display: block; }
      .refresh { font-size: 12px; font-weight: 600; color: var(--ink-2); letter-spacing: 0.01em; }

      h1 {
        font-size: 17px; line-height: 1.2; margin: 0 0 2px;
        font-weight: 800; letter-spacing: -0.01em;
      }
      h2 {
        font-size: 14px; margin: 18px 0 8px; font-weight: 800;
        text-transform: uppercase; letter-spacing: 0.06em;
        display: flex; align-items: center; gap: 8px;
      }
      h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
      h3 {
        font-size: 11px; margin: 12px 0 6px; font-weight: 800;
        text-transform: uppercase; letter-spacing: 0.09em; color: var(--ink-2);
      }
      .matchup-sub { font-size: 12px; color: var(--ink-2); margin: 0 0 4px; }
      .matchup-sub b { color: var(--ink); }

      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        margin-bottom: 10px;
      }

      /* Pick rows */
      .pick {
        display: flex; gap: 8px; align-items: flex-start;
        padding: 7px 0;
        border-bottom: 1px solid var(--line);
      }
      .pick:last-child { border-bottom: none; }
      .rank {
        flex: 0 0 auto; width: 20px; height: 20px; border-radius: 50%;
        background: var(--black); color: var(--bg);
        font-size: 11px; font-weight: 800;
        display: flex; align-items: center; justify-content: center;
        margin-top: 1px;
      }
      .pick-main { flex: 1 1 auto; min-width: 0; }
      .pick-line { font-size: 13px; font-weight: 700; }
      .pick-line .price { white-space: nowrap; }
      .pick-meta { font-size: 11.5px; color: var(--ink-2); margin-top: 1px; }
      .pick-note { font-size: 11.5px; color: var(--ink-2); margin-top: 2px; }
      .star { color: var(--gold); }
      .best-flag {
        font-size: 10px; font-weight: 800; letter-spacing: 0.05em;
        color: var(--gold-ink); background: var(--gold-soft);
        border-radius: 4px; padding: 1px 5px; white-space: nowrap;
        text-transform: uppercase;
      }
      .tag {
        display: inline-block; font-size: 10px; font-weight: 800;
        letter-spacing: 0.05em; text-transform: uppercase;
        border-radius: 4px; padding: 1px 5px; white-space: nowrap;
        vertical-align: 1px;
      }
      .tag-strong { color: var(--strong); background: var(--strong-bg); }
      .tag-lean { color: var(--lean); background: var(--lean-bg); }
      .tag-unv { color: var(--unv); background: var(--unv-bg); }
      .tag-crazy { color: var(--crazy); background: var(--crazy-bg); }
      .conf { font-size: 11px; font-weight: 700; color: var(--ink-2); white-space: nowrap; }
      .plain-note {
        font-size: 12px; color: var(--ink-2);
        padding: 6px 0 2px;
      }
      .plain-note b { color: var(--ink); }

      /* Price chips */
      .books { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
      .book {
        font-size: 11px; border: 1px solid var(--line); border-radius: 6px;
        padding: 2px 6px; color: var(--ink-2); background: var(--surface);
        white-space: nowrap;
      }
      .book b { color: var(--ink); font-weight: 700; }
      .book.fan { border-color: var(--gold); background: var(--fan-bg); color: var(--fan); font-weight: 700; }
      .book.fan b { color: var(--fan); }
      .book.best { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
      .book .unv { color: var(--unv); font-weight: 700; }

      /* Crazy bets */
      .crazy-card { border-left: 4px solid var(--crazy); }
      .crazy-head { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; }
      .crazy-odds { font-size: 15px; font-weight: 800; }
      .crazy-book { font-size: 11px; font-weight: 700; color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.05em; }
      .legs { margin: 5px 0 0; padding: 0; list-style: none; }
      .legs li { font-size: 12px; padding: 2px 0 2px 14px; position: relative; color: var(--ink-2); }
      .legs li::before { content: "+"; position: absolute; left: 2px; font-weight: 800; color: var(--crazy); }
      .legs li:first-child::before { content: "•"; }
      .legs li b { color: var(--ink); }

      /* Detail card */
      .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      @media (max-width: 620px) { .detail-grid { grid-template-columns: 1fr; } }
      .detail-block h3 { margin-top: 0; }
      .detail-block p { margin: 0 0 6px; font-size: 12px; color: var(--ink-2); }
      .detail-block p b { color: var(--ink); }
      .detail-block p:last-child { margin-bottom: 0; }
      .kv { width: 100%; border-collapse: collapse; font-size: 12px; }
      .kv th, .kv td { text-align: left; padding: 3px 6px 3px 0; vertical-align: top; }
      .kv th { color: var(--ink-3); font-weight: 700; white-space: nowrap; width: 34%; }
      .kv td { color: var(--ink); }
      .kv tr { border-bottom: 1px solid var(--line); }
      .kv tr:last-child { border-bottom: none; }
      ul.tight { margin: 0; padding-left: 15px; font-size: 12px; color: var(--ink-2); }
      ul.tight li { margin-bottom: 3px; }
      ul.tight li b { color: var(--ink); }
      .game-picks { margin: 0; padding: 0; list-style: none; }
      .game-picks li {
        font-size: 12px; padding: 4px 0; border-bottom: 1px solid var(--line);
        display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline;
      }
      .game-picks li:last-child { border-bottom: none; }
      .game-picks .gp-name { font-weight: 700; }
      .game-picks .gp-edge { color: var(--ink-2); font-size: 11.5px; }
    </style>
