<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Betting Dashboards</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d0d0d; color: #f2f2f2; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 28px 16px 40px; }
  .wrap { max-width: 880px; margin: 0 auto; }
  h1 { font-size: 30px; font-weight: 800; letter-spacing: .5px; text-align: center; color: #ffffff; }
  .rule { height: 3px; background: #f5b921; border-radius: 2px; margin: 14px auto 26px; max-width: 520px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }
  a.card { display: flex; align-items: center; gap: 14px; background: #1b1b1b; border: 1px solid #333; border-radius: 12px; padding: 16px 18px; text-decoration: none; color: #f2f2f2; transition: border-color .15s ease; }
  a.card:hover { border-color: #f5b921; }
  a.card img { width: 44px; height: 44px; object-fit: contain; flex: none; }
  a.card .label { font-size: 18px; font-weight: 700; }
  a.card .chev { margin-left: auto; color: #f5b921; font-size: 22px; font-weight: 700; flex: none; }
  a.strong { display: flex; align-items: center; justify-content: center; gap: 10px; background: #f5b921; color: #111; border-radius: 12px; padding: 18px; text-decoration: none; font-size: 20px; font-weight: 800; margin-top: 14px; }
  a.strong .chev { font-size: 22px; font-weight: 800; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Betting Dashboards</h1>
  <div class="rule"></div>
  <div class="grid">
    <a class="card" href="nfl-sunday.html"><img src="logos/nfl.png" alt="NFL"><span class="label">NFL Sunday</span><span class="chev">&rsaquo;</span></a>
    <a class="card" href="nfl-sunday-night.html"><img src="logos/nfl.png" alt="NFL"><span class="label">NFL Sunday Night</span><span class="chev">&rsaquo;</span></a>
    <a class="card" href="nfl-monday-night.html"><img src="logos/nfl.png" alt="NFL"><span class="label">NFL Monday Night</span><span class="chev">&rsaquo;</span></a>
    <a class="card" href="nfl-wednesday-night.html"><img src="logos/nfl.png" alt="NFL"><span class="label">NFL Wednesday Night</span><span class="chev">&rsaquo;</span></a>
    <a class="card" href="nfl-thanksgiving.html"><img src="logos/nfl.png" alt="NFL"><span class="label">NFL Thanksgiving</span><span class="chev">&rsaquo;</span></a>
    <a class="card" href="black-friday.html"><img src="logos/nfl.png" alt="NFL"><span class="label">Black Friday</span><span class="chev">&rsaquo;</span></a>
    <a class="card" href="college-football.html"><img src="logos/ncaa-football.png" alt="NCAA Football"><span class="label">College Football</span><span class="chev">&rsaquo;</span></a>
    <a class="card" href="nba.html"><img src="logos/nba.png" alt="NBA"><span class="label">NBA</span><span class="chev">&rsaquo;</span></a>
    <a class="card" href="college-basketball.html"><img src="logos/march-madness.png" alt="NCAA Basketball"><span class="label">College Basketball</span><span class="chev">&rsaquo;</span></a>
  </div>

</div>
